name: YouTube Autopilot

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload and schedule videos? Keep false for the first test."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-autopilot
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PUBLISH_ENABLED: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate videos and optionally publish
        run: python main.py

      - name: Keep generated videos as a test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
          
